buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.0.12077973"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    configurations.classpath {
        resolutionStrategy {
            force "com.android.tools.build:gradle:8.11.1"
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

// Async Storage v3: storage-android is served from the package's local_repo, not Maven Central.
allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("${rootProject.projectDir}/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
